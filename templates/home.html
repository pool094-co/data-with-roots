<!-- Herencia de la estructura base maestra (base.html) -->
{% extends 'base.html' %}

<!-- Inyección del contenido específico para la vista de Inicio -->
{% block content %}
<!-- Tarjeta principal de presentación (Hero Component) estructurada con Bootstrap 5 -->
<div class="p-5 mb-4 bg-white rounded-3 shadow-sm border">
    <div class="container-fluid py-3">
        <!-- Título principal vinculado declarativamente al motor i18n mediante el atributo data-i18n -->
        <h1 class="display-5 fw-bold text-success" data-i18n="home_title">Welcome to Data with Roots</h1>
        
        <!-- Descripción del sistema enlazada dinámicamente -->
        <p class="col-md-10 fs-4 text-muted" data-i18n="home_desc">An interactive web application designed to predict used mobile phone prices based on their age in months.</p>
        
        <!-- Contenedor Flexbox de botones navegables de llamada a la acción (CTA) -->
        <div class="d-flex gap-3 mt-4">
            <a href="/ml/concepts" class="btn btn-outline-success btn-lg" data-i18n="home_btn_explore">Explore ML Concepts</a>
            <a href="/LinearRegression/" class="btn btn-success btn-lg" data-i18n="home_btn_predict">Try Predictive Model</a>
        </div>
    </div>
</div>
{% endblock %}
