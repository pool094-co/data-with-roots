<!-- ==============================================================================
     PLANTILLA: home.html
     DESCRIPCIÓN: Vista principal de bienvenida a la aplicación.
                  Integrada con el motor global de traducción (data-i18n).
     ============================================================================== -->

{% extends 'base.html' %}

{% block content %}
<!-- Contenedor principal tipo Jumbotron de Bootstrap 5 -->
<div class="p-5 mb-4 bg-white rounded-3 shadow-sm border mt-4">
    <div class="container-fluid py-5 text-center">
        <!-- Título principal con traducción dinámica -->
        <h1 class="display-5 fw-bold text-success mb-3" data-i18n="home_title">
            Welcome to Data with Roots
        </h1>
        
        <!-- Descripción de la plataforma -->
        <p class="col-md-8 mx-auto fs-5 text-secondary" data-i18n="home_desc">
            An interactive web application designed to demonstrate Linear Regression, Logistic Regression, and KNN Classification models.
        </p>
        
        <!-- Botones de navegación rápida -->
        <div class="d-flex justify-content-center gap-3 mt-5 flex-wrap">
            <a href="/ml/concepts" class="btn btn-outline-dark btn-lg fw-bold px-4" data-i18n="home_explore">
                Explore ML Concepts
            </a>
            <a href="/LinearRegression/" class="btn btn-success btn-lg fw-bold px-4" data-i18n="home_predict">
                Try Predictive Models
            </a>
        </div>
    </div>
</div>
{% endblock %}
